services:
  web:
    environment:
      APP_ENV: production
      # 网站只经 Caddy 访问，限流从 X-Forwarded-For 取真实来源
      BEHIND_PROXY: 'true'
  worker:
    environment:
      APP_ENV: production
  edge:
    image: caddy:2.10.2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set real DOMAIN}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static_data:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
