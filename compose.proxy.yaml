# 服务器上已有 Nginx / OpenResty / 宝塔 / 1Panel 等反向代理时使用：网站只监听本机端口，HTTPS 和静态文件交给已有的代理。
# 在 .env 里写 COMPOSE_FILE=compose.yaml:compose.proxy.yaml，详见 docs/deployment.md。
services:
  web:
    environment:
      APP_ENV: production
      BEHIND_PROXY: "true"
    ports:
      - "127.0.0.1:${WEB_PORT:-8920}:8000"
    volumes:
      - ./public-static:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Host: $$DOMAIN\" -o /dev/null http://127.0.0.1:8000/login/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  worker:
    environment:
      APP_ENV: production
    depends_on:
      web:
        condition: service_healthy
